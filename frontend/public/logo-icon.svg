<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#180033"/>
      <stop offset="100%" stop-color="#0a0f2a"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#902bd1"/>
      <stop offset="50%"  stop-color="#4fb0ff"/>
      <stop offset="100%" stop-color="#00d0cb"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00d0cb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#902bd1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Hexagon -->
  <polygon
    points="32,7 50,17 50,37 32,47 14,37 14,17"
    fill="url(#hexGrad)"
    filter="url(#glowF)"
    opacity="0.95"
  />
  <polygon
    points="32,7 50,17 50,37 32,47 14,37 14,17"
    fill="url(#glow)"
  />
  <polygon
    points="32,7 50,17 50,37 32,47 14,37 14,17"
    fill="none"
    stroke="rgba(255,255,255,0.3)"
    stroke-width="1"
  />

  <!-- Lightning bolt -->
  <path
    d="M35,14 L27,29 L32,29 L29,42 L40,26 L35,26 Z"
    fill="#ffffff"
    opacity="0.95"
  />

  <!-- "R" letter mark (subtle) below icon -->
  <text
    x="32" y="60"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="8"
    font-weight="700"
    letter-spacing="1"
    fill="#4fb0ff"
    text-anchor="middle"
    opacity="0.7"
  >RAI</text>
</svg>
